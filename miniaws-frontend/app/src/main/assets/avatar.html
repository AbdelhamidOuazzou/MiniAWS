<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: transparent; 
            overflow: hidden; 
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
            --poster-color: transparent;
            /* Mouvement idle naturel (sway) */
            animation: sway 4.5s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }
        
        /* Mouvement ajouté quand l'IA parle */
        model-viewer.talking {
            animation: sway 4.5s ease-in-out infinite alternate, talkBounce 0.25s infinite alternate !important;
        }

        @keyframes sway {
            0% { transform: rotateY(-5deg) translateX(-2px); }
            100% { transform: rotateY(5deg) translateX(2px); }
        }

        @keyframes talkBounce {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-3px); }
        }
    </style>
</head>
<body>
    <model-viewer 
        id="avatar"
        src="models/avatar.glb" 
        camera-controls 
        disable-zoom
        disable-pan
        autoplay 
        shadow-intensity="0" 
        exposure="1.2"
        environment-image="neutral"
        camera-target="0m 1.4m 0m"
        camera-orbit="0deg 85deg 1.2m"
        field-of-view="35deg"
        interaction-prompt="none">
    </model-viewer>

    <script>
        // Fonction appelée directement depuis Android (Java)
        function setTalking(isTalking) {
            const mv = document.getElementById('avatar');
            if (isTalking) {
                mv.classList.add('talking');
            } else {
                mv.classList.remove('talking');
            }
        }
    </script>
</body>
</html>
